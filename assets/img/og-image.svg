<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0d1529"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow circle top-right -->
  <circle cx="1050" cy="100" r="300" fill="url(#glow)"/>

  <!-- Accent bar left -->
  <rect x="80" y="80" width="4" height="470" rx="2" fill="url(#accent)"/>

  <!-- Tag decoration -->
  <text x="112" y="130" font-family="monospace" font-size="22" fill="#3b82f6" opacity="0.5">&lt;portfolio&gt;</text>

  <!-- Avatar -->
  <rect x="112" y="160" width="90" height="90" rx="45" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
  <text x="157" y="215" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="28" fill="white" text-anchor="middle">EC</text>

  <!-- Name -->
  <text x="112" y="310" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="68" fill="white">Eduardo Cremm</text>

  <!-- Gradient underline -->
  <rect x="112" y="325" width="520" height="4" rx="2" fill="url(#accent)"/>

  <!-- Title -->
  <text x="112" y="390" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="32" fill="#94a3b8">Desenvolvedor Full Stack</text>

  <!-- Tech tags -->
  <rect x="112" y="440" width="140" height="42" rx="8" fill="#141e35" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="182" y="466" font-family="monospace" font-size="18" fill="#60a5fa" text-anchor="middle">React</text>

  <rect x="268" y="440" width="160" height="42" rx="8" fill="#141e35" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="348" y="466" font-family="monospace" font-size="18" fill="#a78bfa" text-anchor="middle">Next.js</text>

  <rect x="444" y="440" width="160" height="42" rx="8" fill="#141e35" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="524" y="466" font-family="monospace" font-size="18" fill="#60a5fa" text-anchor="middle">Node.js</text>

  <rect x="620" y="440" width="200" height="42" rx="8" fill="#141e35" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="720" y="466" font-family="monospace" font-size="18" fill="#a78bfa" text-anchor="middle">TypeScript</text>

  <!-- URL -->
  <text x="112" y="560" font-family="monospace" font-size="22" fill="#3b82f6">www.eduardocremmdev.com.br</text>

  <!-- Closing tag -->
  <text x="112" y="600" font-family="monospace" font-size="22" fill="#8b5cf6" opacity="0.5">&lt;/portfolio&gt;</text>
</svg>
